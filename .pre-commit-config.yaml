# Run with prek, not pre-commit. Tool versions come from pyproject.toml and uv.lock.
# Local hooks avoid maintaining a second set of tool versions in hook revisions.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --locked ruff check
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: Ruff format
        entry: uv run --locked ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ty
        name: ty type check
        entry: uv run --locked ty check cabotage
        language: system
        files: '(^cabotage/.*\.pyi?$|^pyproject\.toml$|^uv\.lock$)'
        pass_filenames: false
        require_serial: true

      - id: pyrefly
        name: pyrefly type check
        entry: uv run --locked pyrefly check --error-stale-baseline
        language: system
        files: '(^cabotage/.*\.pyi?$|^baseline\.json$|^pyproject\.toml$|^uv\.lock$)'
        pass_filenames: false
        require_serial: true

      - id: bandit
        name: Bandit security check
        entry: uv run --locked bandit -c pyproject.toml
        language: system
        types: [python]
        require_serial: true
